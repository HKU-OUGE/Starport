Host starship
    HostName device.example.invalid
    User device-user
    IdentityFile ~/.ssh/starship
    IdentitiesOnly yes
    StrictHostKeyChecking yes
    ForwardAgent no
    SendEnv -*
    ServerAliveInterval 10
    ServerAliveCountMax 2

# Use a dedicated key on the device. Replace the key with its public half:
# restrict,command=".local/share/starship/rpc" ssh-ed25519 EXAMPLE_PUBLIC_KEY
