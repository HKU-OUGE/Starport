name: Verify Starport and Starship
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -p test_platforms.py -v
      - run: python -m unittest discover -s server/console/tests -p test_attachments.py -v
      - run: python setup.py server --plan
      - run: python setup.py client --plan
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server/console/web
      - run: npm test
        working-directory: server/console/web
      - run: npm run build
        working-directory: server/console/web
      - run: python audit_repository.py
      - if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -v
        working-directory: server/console
